# NOT APPLIED. PUBLIC STATIC SITE: ONLY after independent Security/Legal/IP approval,
# authorized HTTPS QA, physical Samsung QA and owner's exact-version approval.
# Render Blueprint syntax verified against https://render.com/docs/blueprint-spec
services:
  - type: web
    runtime: static
    name: xrpl-rwa-risk-passport
    repo: https://github.com/proofandsignal/XRP
    branch: demo/boost-nine-20261113
    plan: free
    autoDeploy: false
    buildCommand: node --test preview/boost-nine/test.mjs preview/rwa-passport/build.test.mjs && node preview/rwa-passport/build.mjs
    staticPublishPath: dist/rwa-passport
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'none'; img-src 'self'; font-src 'none'; connect-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Cache-Control
        value: no-store
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=()"
