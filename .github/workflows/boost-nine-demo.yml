name: Project Boost 9 Demo static checks
on:
  pull_request:
    paths:
      - 'preview/boost-nine/**'
      - 'preview/rwa-passport/**'
      - '.github/workflows/boost-nine-demo.yml'
  workflow_dispatch:
concurrency:
  group: boost-nine-rwa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  RWA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  static-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse and verify demo contract
        run: node --test preview/boost-nine/test.mjs preview/boost-nine/protected-preview.test.mjs preview/rwa-passport/build.test.mjs
      - name: Produce isolated RWA static artifact (NOT deployed)
        run: node preview/rwa-passport/build.mjs
      - name: Package runnable standalone RWA demo without deploying
        uses: actions/upload-artifact@v4
        with:
          name: rwa-standalone-html-candidate
          path: dist/rwa-passport/
          if-no-files-found: error
          retention-days: 7
  browser-review:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.58.0-noble
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install matching Playwright Node client
        run: npm install --no-save --package-lock=false playwright@1.58.0
      - name: Produce isolated RWA static artifact (NOT deployed)
        run: node preview/rwa-passport/build.mjs
      - name: Execute Chromium desktop and mobile viewport checks
        run: node --test preview/boost-nine/browser-qa.mjs preview/boost-nine/auth-browser-qa.mjs preview/rwa-passport/browser-qa.mjs
      - name: Save RWA desktop/mobile Chromium screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rwa-chromium-visual-evidence
          path: test-results/rwa/*.png
          if-no-files-found: warn
          retention-days: 7
