name: LAB-005 RWA Risk Passport

on:
  pull_request:
    paths:
      - "labs/005-rwa-risk-passport/**"
      - "docs/PRODUCT-002-RWA-RISK-PASSPORT.md"
      - ".github/workflows/lab-005-rwa-risk-passport.yml"
  push:
    branches:
      - "lab/005-rwa-risk-passport"
    paths:
      - "labs/005-rwa-risk-passport/**"
      - "docs/PRODUCT-002-RWA-RISK-PASSPORT.md"
      - ".github/workflows/lab-005-rwa-risk-passport.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/005-rwa-risk-passport
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm test

  live-devnet-smoke:
    needs: unit-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/005-rwa-risk-passport
    env:
      XRPL_WS: wss://s.devnet.rippletest.net:51233/
          steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run discover
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-005-devnet-discovery-smoke
          path: labs/005-rwa-risk-passport/artifacts/*.json
          if-no-files-found: warn
